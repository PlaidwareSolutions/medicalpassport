# Production marketing Worker for medicinepassport.app — the rebrand primary
# domain (Session: medidocs.app → medicinepassport.app). A SEPARATE Worker from
# medidocs-marketing-production so each apex serves its correctly-branded static
# artifact (canonical, CTA, Web-Analytics token differ per domain). Both stay
# noindexed during the soft launch. www is a Cloudflare Redirect Rule, not a
# route here (do not serve a second copy on www).
#
# Deploy: `pnpm deploy:soft-launch:medicinepassport`
name = "medicinepassport-marketing-production"
compatibility_date = "2026-08-01"
account_id = "db356ac44b40bc2b194b6838d03eb84b"

[assets]
directory = "./out"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[routes]]
pattern = "medicinepassport.app"
custom_domain = true
