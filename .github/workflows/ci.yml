name: CI

on:
  push:
    # foundation is the working branch BOTH Railway environments deploy from
    # (.railway/*.ts track it), so it is exactly the ref that needs gating —
    # discovered the hard way: with [main] only, CI had never run once, and
    # every "CI will catch it" assumption was resting on local runs.
    branches: [main, foundation]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medpass
          POSTGRES_PASSWORD: medpass
          POSTGRES_DB: medpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medpass"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://medpass:medpass@localhost:5432/medpass
      OTP_HASH_PEPPER: ci-otp-pepper-not-secret
      SESSION_TOKEN_PEPPER: ci-session-pepper-not-secret
      # Added when the admin-password feature made this required — CI had
      # never run, so the gap surfaced only on the first real execution.
      ADMIN_PASSWORD_PEPPER: ci-admin-pepper-not-secret
      FIELD_ENCRYPTION_KEY: ci-field-key-not-secret-32bytes!
      OTP_TRANSPORT: log
      OTP_DEV_FIXED_CODE: "000000"
      # Without this the API serves no CORS headers and every browser-side
      # /v1 call in the Playwright suite dies cross-origin (:3000 → :4000).
      # Found via CI-only education failures: most suites assert shell-level
      # UI and masked it; the education tests need API-backed state.
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No explicit version: the action reads `packageManager` from
      # package.json (pnpm@9.15.9) — specifying both is a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate + migration check
        run: |
          pnpm --filter @medpass/database generate
          pnpm --filter @medpass/database exec prisma migrate deploy
          # Fail if the schema drifted from committed migrations.
          pnpm --filter @medpass/database exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Seed (sample catalog)
        run: pnpm --filter @medpass/database seed

      - name: Test
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm --filter @medpass/patient-web exec playwright install --with-deps chromium

      # --with-deps ships CJK/Thai/emoji fonts but no Indic ones, so Telugu
      # rendered via a wider fallback and four te reflow tests measured
      # ~337px against the 321px gate — metrics no real Indian phone has.
      # Noto core gives the runner the same shaping real devices use.
      - name: Install Indic fonts
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core

      # Accessibility gate (docs/33 engineering-enforcement table): reflow at
      # 320px × 200% across every screen and locale, plus axe-core with zero
      # serious/critical violations. Playwright boots the built API + web
      # itself (its webServer config), reusing this job's DB and env.
      - name: Accessibility suite (reflow + axe)
        run: pnpm --filter @medpass/patient-web test:e2e

      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: apps/patient-web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-staging:
    # Railway deploy hook (docs/25): fill in RAILWAY_TOKEN + service IDs when
    # the Railway projects exist (Requires platform configuration).
    if: github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy to Railway staging — configure railway up / railway deploy here"

  deploy-marketing-staging:
    # Marketing site → Cloudflare Workers Static Assets → staging.medidocs.app
    # (docs/landing-page/infrastructure.md, Session 6). STAGING ONLY: the
    # wrangler config defines no production apex/www target, so this job
    # cannot deploy medidocs.app even by accident. Skips gracefully while the
    # CLOUDFLARE_API_TOKEN repo secret is not yet provisioned, so ordinary CI
    # is never broken by a missing deploy credential.
    if: github.event_name == 'push' && github.ref == 'refs/heads/foundation'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deploy credential
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN secret not set — skipping marketing staging deploy."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build static export (staging flavor — disallow-all robots, empty sitemap)
        if: steps.creds.outputs.ok == 'true'
        env:
          MARKETING_ENV: staging
          NEXT_PUBLIC_LEAD_API_URL: https://staging-api.medidocs.app/v1/public/leads
          # Cloudflare Turnstile PUBLIC test sitekey (always-passes, visible) —
          # pairs with the api's LEAD_TURNSTILE_SECRET_KEY test secret on
          # medpass-dev. Swap both for a real medidocs-marketing-leads-staging
          # widget once a Turnstile-scoped Cloudflare token is available.
          NEXT_PUBLIC_LEAD_TURNSTILE_SITEKEY: 1x00000000000000000000AA
        run: pnpm --filter @medpass/marketing-web build
      - name: Verify export output
        if: steps.creds.outputs.ok == 'true'
        run: |
          test -f apps/marketing-web/out/index.html
          test -f apps/marketing-web/out/_headers
          if grep -riq "for-clinics" apps/marketing-web/out/; then
            echo "Professional unit content found in export while gate is OFF" >&2
            exit 1
          fi
      - name: Deploy to staging.medidocs.app
        if: steps.creds.outputs.ok == 'true'
        run: pnpm --filter @medpass/marketing-web exec wrangler deploy
